# 开发环境可选：仅基础设施容器化（后端/前端本机跑，调试体验最好）
# 本机无 Docker 时：MySQL 用本机安装版、Redis 用 Memurai、Chroma 用嵌入式（CHROMA_MODE=embedded）
services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: rag_qa
      MYSQL_USER: rag_user
      MYSQL_PASSWORD: rag_pass_2024
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  chroma:
    image: chromadb/chroma:0.5.23
    ports:
      - "8001:8001"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

volumes:
  mysql_data:
  chroma_data:
